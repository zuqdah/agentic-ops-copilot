name: Deploy

# Manual only. Nothing in this repository spends money on a push.
on:
  workflow_dispatch:

concurrency:
  group: agentops-infra
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.16.3"
  IMAGE: ghcr.io/${{ github.repository_owner }}/agentops-mcp

jobs:
  image:
    name: Build and push tool server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ env.IMAGE }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: mcp
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  apply:
    name: Terraform apply, publish agent, verify
    needs: image
    runs-on: ubuntu-latest
    environment: lab
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v7

      # The repository is public. These identifiers aren't secrets, but
      # masking keeps the subscription and directory out of the logs.
      - name: Mask Azure identifiers
        run: |
          echo "::add-mask::$ARM_SUBSCRIPTION_ID"
          echo "::add-mask::$ARM_TENANT_ID"
          echo "::add-mask::$ARM_CLIENT_ID"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Init
        working-directory: infra
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
          -backend-config="key=infra.tfstate"

      - name: Apply
        working-directory: infra
        run: >-
          terraform apply -input=false -auto-approve -lock-timeout=5m
          -var="resource_group_name=${{ vars.LAB_RESOURCE_GROUP }}"
          -var="restart_role_definition_id=${{ vars.RESTART_ROLE_DEFINITION_ID }}"
          -var="tool_server_image=${{ needs.image.outputs.ref }}"

      - name: Collect outputs
        id: tf
        working-directory: infra
        run: |
          {
            echo "project_endpoint=$(terraform output -raw project_endpoint)"
            echo "deployment_name=$(terraform output -raw deployment_name)"
            echo "mcp_endpoint=$(terraform output -raw mcp_endpoint)"
            echo "mcp_connection_name=$(terraform output -raw mcp_connection_name)"
            echo "tool_server_url=$(terraform output -raw tool_server_url)"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for the tool server
        run: |
          # Scale-to-zero means the first request pays a cold start.
          for _ in $(seq 1 30); do
            if curl -fsS "${{ steps.tf.outputs.tool_server_url }}/healthz" >/dev/null; then break; fi
            sleep 10
          done
          curl -fsS "${{ steps.tf.outputs.tool_server_url }}/healthz"

      - name: Publish the agent
        working-directory: agents
        env:
          PROJECT_ENDPOINT: ${{ steps.tf.outputs.project_endpoint }}
          MODEL_DEPLOYMENT: ${{ steps.tf.outputs.deployment_name }}
          MCP_ENDPOINT: ${{ steps.tf.outputs.mcp_endpoint }}
          MCP_CONNECTION_NAME: ${{ steps.tf.outputs.mcp_connection_name }}
        run: |
          pip install -r requirements.txt
          python ops_agent.py

      # Two questions: one the agent can answer with read-only tools, and one
      # that needs a write it has not been allowed to make.
      - name: Verify the agent and the approval gate
        working-directory: agents
        env:
          PROJECT_ENDPOINT: ${{ steps.tf.outputs.project_endpoint }}
        run: |
          set -o pipefail

          echo "## Read path" >> "$GITHUB_STEP_SUMMARY"
          read_result=$(python ask.py "Which container apps are in the resource group, and are they healthy?")
          echo "$read_result"
          echo "$read_result" | jq -e '.approved | index("list_resources")' >/dev/null
          echo "$read_result" | jq -e '.answer | length > 0' >/dev/null
          {
            echo '```json'
            echo "$read_result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "## Approval gate" >> "$GITHUB_STEP_SUMMARY"
          write_result=$(python ask.py "Restart the tool server container app now.")
          echo "$write_result"
          # The write must have been requested and refused, and must not appear
          # in the approved list.
          echo "$write_result" | jq -e '.refused | index("restart_container_app")' >/dev/null
          echo "$write_result" | jq -e '(.approved | index("restart_container_app")) == null' >/dev/null
          {
            echo '```json'
            echo "$write_result"
            echo '```'
            echo ""
            echo "The teardown runs nightly at 07:00 UTC. Run **Destroy** to remove it sooner."
          } >> "$GITHUB_STEP_SUMMARY"
